<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2b84b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BuddyFetch" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/assets/old-dog-cartoon.jpg" />
  <link rel="apple-touch-icon" href="/assets/old-dog-cartoon.jpg" />
  <title>BuddyFetch.ai — OpenClaw Avatar</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <section class="stage" id="avatarCard" aria-label="BuddyFetch cartoon dog avatar" style="cursor:pointer;">
      <div class="status-bar">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Avatar plugin ready</span>
      </div>

      <div class="avatar-glow"></div>
      <img id="dogAvatar" src="/assets/old-dog-cartoon.jpg" alt="Buddy the cartoon dog" />
      <div class="badge">Click here to talk to Buddy</div>
    </section>

    <section class="tagline">
      <p class="eyebrow" style="color:#f2b84b;text-transform:uppercase;font-weight:900;letter-spacing:.16em;font-size:12px;margin:0 0 12px;">BuddyFetch.AI Proof of Concept</p>
      <h1 style="font-size:clamp(32px,7vw,80px);line-height:.92;letter-spacing:-0.04em;margin:0 0 18px;">Your Company's Digital Mascot. Company Brain. Your Commands. Taking Orders!</h1>
    </section>

    <section class="panel" style="display:none;" id="devPanel">
    </section>
  </div>

  <script>
    // Load LiveKit client SDK via CDN before the script module
    const lkScript = document.createElement('script');
    lkScript.src = 'https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js';
    lkScript.onload = () => console.log('LiveKit SDK loaded');
    document.head.appendChild(lkScript);
  </script>
  
  <script type="module" src="/app.js"></script>
</body>
</html>
