<style>

.buddy-avatar-promo .btn{display:block;width:100%;box-sizing:border-box;padding:14px 16px;margin:8px 0;border-radius:999px;border:none;font-size:15px;font-weight:600;cursor:pointer;}
.buddy-avatar-promo .btn-primary{background:#7a3fb0;color:#fff;}

#lk-stage{display:none;}
#lk-stage video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;background:#111;display:block;}
#lk-status{min-height:20px;color:#d8c3ae;font-size:14px;margin:10px 0;text-align:center;}
#lk-end{display:none;width:100%;padding:12px;border-radius:999px;border:none;background:#7a1212;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}lemon-slice-widget{transition:transform .25s ease;display:none;}
lemon-slice-widget[controlled-widget-state="active"]{display:block;}
</style>
</head><body>

<h1>PAMI - iLendGirl</h1>
<p>I am PAMI, Pam Campbell's Virtual Assistant at iLendGirl.com, Super Powered by BuddyFetch.AI + OpenClaw. I keep Pam's company knowledge base and handle real tasks, jobs and workflows. How can I help?</p>
<button type="button" class="btn btn-primary" id="start-buddy-avatar">Start Fetch Mode</button>
<button type="button" class="btn btn-secondary" id="open-local-plugin-ui">Save to Your Home Screen</button>
</div>

<video id="lk-video" autoplay playsinline muted></video>
<div id="lk-status">Connecting...</div>
<button id="lk-end">End Call</button>
</div>
</div>
<lemon-slice-widget agent-id="agent_79cd6d385f8745b2" inline="" custom-minimized-width="200" custom-minimized-height="300" custom-active-width="320" custom-active-height="520" video-button-color-opacity="0.88" show-minimize-button="true" initial-state="minimized"></lemon-slice-widget><script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script><script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script><script>var lkRoom=null;
function openBuddyAvatar(){var w=document.querySelector('lemon-slice-widget');if(!w)return;w.setAttribute('controlled-widget-state','active');}
document.getElementById('buddy-avatar-trigger').addEventListener('click',openBuddyAvatar);
function lkStatus(m){document.getElementById('lk-status').textContent=m;}
async function startPami(){try{var w=document.querySelector('lemon-slice-widget');if(w){w.setAttribute('controlled-widget-state','minimized');}
document.getElementById('promo-main').style.display='none';document.getElementById('lk-stage').style.display='block';
lkStatus('Getting a LiveKit token...');
var part='visitor-'+Math.floor(Math.random()*1e5);
var r=await fetch('/api/start?room=pami-demo&participant='+encodeURIComponent(part)+'&dispatch=0&t='+Date.now());
if(!r.ok)throw new Error('token HTTP '+r.status);var t=await r.json();
lkStatus('Connecting to PAMI...');
lkRoom=new LivekitClient.Room({adaptiveStream:false,dynacast:false});
lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed,function(track,pub,participant){if(track.kind==='video'){track.attach(document.getElementById('lk-video'));document.getElementById('lk-video').play().catch(function(){});}else if(track.kind==='audio'){var a=track.attach();a.style.display='none';document.body.appendChild(a);}});
lkRoom.on(LivekitClient.RoomEvent.TrackUnsubscribed,function(track){if(track.kind==='video')track.detach();});
lkRoom.on(LivekitClient.RoomEvent.Disconnected,function(){lkRoom=null;document.getElementById('lk-stage').style.display='none';document.getElementById('promo-main').style.display='block';document.getElementById('lk-end').style.display='none';});
await lkRoom.connect(t.url,t.token);
try{await lkRoom.startAudio();}catch(e){}
var mic=await LivekitClient.createLocalAudioTrack();
await lkRoom.localParticipant.publishTrack(mic);
lkStatus('Connected - PAMI (iLendGirl.com) is on.');
document.getElementById('lk-end').style.display='block';}catch(e){lkStatus('Could not connect: '+e.message);}}
document.getElementById('start-buddy-avatar').addEventListener('click',startPami);
document.getElementById('lk-end').addEventListener('click',async function(){if(lkRoom){await lkRoom.disconnect();lkRoom=null;}});
var deferredPrompt=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;});document.getElementById('open-local-plugin-ui').addEventListener('click',function(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}else if(/iPhone|iPad|iPod/.test(navigator.userAgent)){alert('To add PAMI to your Home Screen:\n\n1. Tap the Share button\n2. Tap "Add to Home Screen"\n3. Tap "Add"');}else{alert('To save PAMI to your Home Screen, open your browser menu and choose "Install app" or "Add to Home screen".');}});</script>
<script>
/* Swipe / arrow navigation cycle:
   left swipe (ArrowLeft) = next, right swipe (ArrowRight) = previous
   Cycle: Hey Ginger -> iLendGirl -> SlamDunk -> Hey Ginger */
(function(){
  var ORDER=['/ginger','/ilendgirl','/slamdunk'];
  function idx(){
    var p=location.pathname.toLowerCase();
    if(p.indexOf('ginger')>-1) return 0;
    if(p.indexOf('ilendgirl')>-1||p.indexOf('pami')>-1) return 1;
    return 2;
  }
  function go(dir){var i=idx(),n=(i+dir+ORDER.length)%ORDER.length;location.href=ORDER[n];}
  var sx=0,sy=0,tracking=false;
  document.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;tracking=true;},{passive:true});
  document.addEventListener('touchmove',function(e){if(tracking&&Math.abs(e.touches[0].clientX-sx)>10)e.preventDefault();},{passive:false});
  document.addEventListener('touchend',function(e){
    if(!tracking) return; tracking=false;
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){go(dx<0?1:-1);}
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft')go(1);else if(e.key==='ArrowRight')go(-1);
  });
})();
</script>
